<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senon Industrias | Catálogo B2B</title>
    
    <!-- ETIQUETAS PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b00">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="public-header">
        <div class="logo-container">
            <div class="logo-text">SENON</div>
            <div class="logo-subtext">INDUSTRIAS C.A.</div>
        </div>
        <div class="header-actions" style="display:flex; gap:15px; align-items:center;">
            <button class="btn btn-outline" id="theme-toggle">🌙</button>
            <button class="btn btn-outline" id="btn-open-service">Servicio Técnico</button>
            <button class="btn btn-primary" id="btn-open-auth">Ingresar</button>
        </div>
    </header>

    <main class="public-main">
        <section class="hero" style="text-align: center;">
            <h1>Catálogo Especializado</h1>
            <p>Insumos de alta precisión para laboratorios clínicos.</p>
            <div class="search-bar" style="display:flex; justify-content:center;">
                <input type="text" id="search-input" placeholder="Buscar por nombre, marca o categoría...">
            </div>
        </section>

        <section class="catalog-grid" id="catalog-container">
            <p style="text-align:center; grid-column: 1/-1;">Cargando catálogo...</p>
        </section>
    </main>

    <!-- Botón flotante del carrito -->
    <button class="btn btn-primary" id="btn-open-cart" style="position:fixed; bottom:30px; right:30px; border-radius:50%; width:60px; height:60px; font-size:24px; box-shadow: var(--shadow-lg);">
        🛒 <span id="cart-count" style="position:absolute; top:-5px; right:-5px; background:var(--accent); color:white; border-radius:50%; padding:2px 8px; font-size:12px;">0</span>
    </button>

    <!-- MODALES -->
    <div class="modal-overlay" id="modal-auth">
        <div class="modal-content" style="position:relative;">
            <button class="close-modal" id="close-auth">×</button>
            <h2 style="text-align:center; margin-bottom:20px;">Acceso al Portal</h2>
            <div id="auth-message" class="message"></div>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn btn-outline w-100" id="tab-login">Ingresar</button>
                <button class="btn btn-outline w-100" id="tab-register">Registro</button>
            </div>
            <form id="form-login" class="form-section active">
                <div class="form-group"><input type="email" id="login-email" class="form-control" placeholder="Correo" required></div>
                <div class="form-group"><input type="password" id="login-password" class="form-control" placeholder="Contraseña" required></div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <form id="form-register" class="form-section" style="display:none;">
                <div class="form-group"><input type="text" id="reg-rif" class="form-control" placeholder="RIF" required></div>
                <div class="form-group"><input type="text" id="reg-lab" class="form-control" placeholder="Nombre del Laboratorio" required></div>
                <div class="form-group"><input type="text" id="reg-contacto" class="form-control" placeholder="Nombre del Bioanalista" required></div>
                <div class="form-group"><input type="tel" id="reg-telefono" class="form-control" placeholder="Teléfono" required></div>
                <div class="form-group"><input type="email" id="reg-email" class="form-control" placeholder="Correo" required></div>
                <div class="form-group"><input type="password" id="reg-password" class="form-control" placeholder="Contraseña" required></div>
                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modal-cart">
        <div class="modal-content" style="position:relative;">
            <button class="close-modal" id="close-cart">×</button>
            <h2>Mi Carrito</h2>
            <div id="cart-items" style="margin: 20px 0;"></div>
            <button class="btn btn-primary w-100" id="btn-request-quote">Solicitar Cotización</button>
        </div>
    </div>

    <!-- SCRIPT PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(function(registration) {
                console.log('Service Worker registrado con éxito:', registration.scope);
            }).catch(function(error) {
                console.log('Fallo al registrar el Service Worker:', error);
            });
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
