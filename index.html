<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senon Industrias | Catálogo B2B</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="theme-color" content="#1a2b4c">
</head>
<body>

    <!-- HEADER PÚBLICO -->
    <header>
        <div class="logo-container">
            <div class="logo-text">SENON</div>
            <div class="logo-subtext">INDUSTRIAS C.A.</div>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">
                <svg id="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <svg id="icon-sun" style="display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
            <!-- Botón que abre el modal de Login -->
            <button class="btn-outline" id="btn-open-auth">Ingresar / Registrarse</button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL (CATÁLOGO) -->
    <main>
        <section class="hero">
            <h1>Catálogo de Reactivos y Equipos</h1>
            <p>Distribución de insumos para laboratorios clínicos. Inicia sesión para ver precios y cotizar.</p>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar por nombre, marca o categoría...">
            </div>
        </section>

        <section class="catalog-grid" id="catalog-container">
            <!-- Aquí JavaScript inyectará las tarjetas de los productos -->
            <p style="text-align:center; width:100%; grid-column: 1/-1; color: var(--text-muted);">Cargando catálogo...</p>
        </section>
    </main>

    <!-- BOTÓN FLOTANTE DEL CARRITO -->
    <button class="cart-btn" id="btn-open-cart">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span class="cart-count" id="cart-count">0</span>
    </button>

    <!-- MODAL: LOGIN / REGISTRO -->
    <div class="modal-overlay" id="modal-auth">
        <div class="modal-content">
            <button class="close-modal" id="close-auth">×</button>
            <div class="logo-container" style="text-align: center; margin-bottom: 20px;">
                <div class="logo-text">SENON</div>
            </div>

            <div id="auth-message" class="message"></div>

            <div class="tabs">
                <button class="tab active" id="tab-login">Iniciar Sesión</button>
                <button class="tab" id="tab-register">Nuevo Registro</button>
            </div>

            <form id="form-login" class="form-section active">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary btn-full" id="btn-login">Ingresar</button>
            </form>

            <form id="form-register" class="form-section">
                <div class="form-group">
                    <label>RIF del Laboratorio</label>
                    <input type="text" id="reg-rif" class="form-control" placeholder="J-12345678-9" required>
                </div>
                <div class="form-group">
                    <label>Nombre del Laboratorio</label>
                    <input type="text" id="reg-lab" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Nombre del Bioanalista</label>
                    <input type="text" id="reg-contacto" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Teléfono (WhatsApp)</label>
                    <input type="tel" id="reg-telefono" class="form-control" placeholder="0414-0000000" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn-primary btn-full" id="btn-register">Registrarse</button>
            </form>
        </div>
    </div>

    <!-- MODAL: CARRITO DE COTIZACIÓN -->
    <div class="modal-overlay" id="modal-cart">
        <div class="modal-content">
            <button class="close-modal" id="close-cart">×</button>
            <h2>Mi Cotización</h2>
            <div id="cart-items" style="margin-bottom: 20px;">
                <!-- Aquí se listan los productos agregados -->
            </div>
            <button class="btn-primary btn-full" id="btn-request-quote">Solicitar Cotización Formal</button>
        </div>
    </div>

    <!-- LÓGICA DE LA PÁGINA (APP.JS) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
