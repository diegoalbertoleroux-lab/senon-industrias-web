<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senon Industrias | Portal B2B</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Meta para PWA -->
    <meta name="theme-color" content="#1a2b4c">
</head>
<body>

    <!-- Botón Modo Oscuro/Claro -->
    <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">
        <!-- Icono SVG de Luna -->
        <svg id="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <!-- Icono SVG de Sol (oculto por defecto) -->
        <svg id="icon-sun" style="display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    </button>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="logo-container">
                <div class="logo-text">SENON</div>
                <div class="logo-subtext">INDUSTRIAS C.A.</div>
            </div>

            <!-- Pestañas -->
            <div class="tabs">
                <button class="tab active" id="tab-login">Iniciar Sesión</button>
                <button class="tab" id="tab-register">Registro B2B</button>
            </div>

            <!-- Mensajes de Error/Éxito -->
            <div id="auth-message" class="message"></div>

            <!-- Formulario de Login -->
            <form id="form-login" class="form-section active">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" placeholder="laboratorio@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" id="btn-login">Ingresar</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="form-register" class="form-section">
                <div class="form-group">
                    <label>RIF del Laboratorio</label>
                    <input type="text" id="reg-rif" class="form-control" placeholder="J-12345678-9" required>
                </div>
                <div class="form-group">
                    <label>Nombre del Laboratorio</label>
                    <input type="text" id="reg-lab" class="form-control" placeholder="Laboratorio Clínico..." required>
                </div>
                <div class="form-group">
                    <label>Nombre del Bioanalista / Contacto</label>
                    <input type="text" id="reg-contacto" class="form-control" placeholder="Nombre y Apellido" required>
                </div>
                <div class="form-group">
                    <label>Teléfono (WhatsApp)</label>
                    <input type="tel" id="reg-telefono" class="form-control" placeholder="0414-0000000" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="laboratorio@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <button type="submit" class="btn-primary" id="btn-register">Solicitar Registro</button>
            </form>

        </div>
    </div>

    <!-- Lógica de la página -->
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- 1. Lógica del Modo Oscuro ---
        const themeToggle = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            iconSun.style.display = 'block';
            iconMoon.style.display = 'none';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            iconSun.style.display = isDark ? 'block' : 'none';
            iconMoon.style.display = isDark ? 'none' : 'block';
        });

        // --- 2. Lógica de Pestañas ---
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const authMessage = document.getElementById('auth-message');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            formLogin.classList.add('active');
            formRegister.classList.remove('active');
            authMessage.style.display = 'none';
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            formRegister.classList.add('active');
            formLogin.classList.remove('active');
            authMessage.style.display = 'none';
        });

        // --- 3. Lógica de Firebase Auth (Login y Registro) ---
        
        // Función para mostrar mensajes
        function mostrarMensaje(texto, tipo) {
            authMessage.textContent = texto;
            authMessage.className = `message ${tipo}`;
        }

        // Login
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');
            
            btn.textContent = "Ingresando...";
            btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                mostrarMensaje("Acceso correcto. Redirigiendo...", "success");
                // Aquí luego redirigiremos al catálogo
                setTimeout(() => { window.location.reload(); }, 1500); 
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/invalid-credential') {
                    mostrarMensaje("Correo o contraseña incorrectos.", "error");
                } else {
                    mostrarMensaje("Error al ingresar. Intente de nuevo.", "error");
                }
            } finally {
                btn.textContent = "Ingresar";
                btn.disabled = false;
            }
        });

        // Registro
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('btn-register');

            // Datos del formulario
            const datosCliente = {
                rif: document.getElementById('reg-rif').value,
                nombre_laboratorio: document.getElementById('reg-lab').value,
                nombre_contacto: document.getElementById('reg-contacto').value,
                telefono: document.getElementById('reg-telefono').value,
                email: email,
                estado: "pendiente", // El admin debe aprobarlo luego
                nivel_precio: "D", // Nivel por defecto
                fecha_registro: new Date()
            };

            btn.textContent = "Creando cuenta...";
            btn.disabled = true;

            try {
                // 1. Crear el usuario en Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Guardar los datos extra en Firestore (colección usuarios)
                await setDoc(doc(db, "usuarios", user.uid), datosCliente);

                mostrarMensaje("Registro exitoso. Tu cuenta está pendiente de aprobación por un administrador.", "success");
                formRegister.reset();
                
                // Pasar a la pestaña de login después de 3 segundos
                setTimeout(() => { tabLogin.click(); }, 4000);

            } catch (error) {
                console.error(error);
                if (error.code === 'auth/email-already-in-use') {
                    mostrarMensaje("Este correo ya está registrado.", "error");
                } else {
                    mostrarMensaje("Error al registrar. Verifica los datos.", "error");
                }
            } finally {
                btn.textContent = "Solicitar Registro";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
