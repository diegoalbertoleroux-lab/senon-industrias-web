<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Senon Industrias</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos exclusivos para el panel admin */
        .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
        .admin-card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .table-products { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table-products th, .table-products td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .table-products th { background: var(--input-bg); color: var(--text-muted); font-size: 13px; text-transform: uppercase; }
        .badge { background: var(--primary); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header class="header-admin">
        <div class="logo-container">
            <div class="logo-text">SENON <span style="font-size:14px; color:var(--text-muted);">ADMIN</span></div>
        </div>
        <a href="index.html" class="btn-outline">Ir al Catálogo</a>
    </header>

    <main class="admin-container">
        <h1 style="margin-bottom: 30px;">Gestión de Inventario</h1>
        
        <div class="admin-grid">
            <!-- FORMULARIO DE CARGA -->
            <div class="admin-card">
                <h2>Nuevo Producto</h2>
                <div id="admin-message" class="message" style="margin-bottom:15px;"></div>
                <form id="form-product">
                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="prod-nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="prod-categoria" class="form-control" required>
                            <option value="Bioquimica">Bioquímica</option>
                            <option value="Hematologia">Hematología</option>
                            <option value="Coagulacion">Coagulación</option>
                            <option value="Serologia">Serología</option>
                            <option value="Inmunologia">Inmunología</option>
                            <option value="Miscelaneos">Misceláneos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="prod-desc" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary btn-full" id="btn-save">Guardar Producto</button>
                </form>
            </div>

            <!-- TABLA DE PRODUCTOS -->
            <div class="admin-card" style="overflow-x: auto;">
                <h2>Productos en Catálogo</h2>
                <table class="table-products">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Aquí JS cargará los productos -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
